<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI與數位學習教學主題總覽</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Inter:wght@300;400;600;700&display=swap');

  :root {
    --primary: #1A56A0;
    --primary-light: #2A76D0;
    --primary-dark: #0E3A72;
    --accent: #E8A020;
    --accent-light: #F5C55A;
    --bg: #F0F4FA;
    --surface: #FFFFFF;
    --surface-2: #EEF4FB;
    --text: #1C2B3A;
    --text-muted: #5A7090;
    --border: #C8D8EC;
    --tag-bg: #D5E8F0;
    --tag-text: #0E3A72;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(26,86,160,0.10);
    --shadow-hover: 0 8px 36px rgba(26,86,160,0.18);
    --transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { font-size: 19px; 
    font-family: 'Noto Sans TC', 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.7;
  }

  /* ─── HERO ─── */
  .hero {
    background: linear-gradient(135deg, #0E3A72 0%, #1A56A0 55%, #2A76D0 100%);
    padding: 60px 24px 48px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Ccircle cx='30' cy='30' r='4'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(232,160,32,0.2);
    border: 1px solid rgba(232,160,32,0.5);
    color: var(--accent-light);
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 18px;
    border-radius: 100px;
    margin-bottom: 20px;
  }
  .hero h1 {
    color: #fff;
    font-size: clamp(1.9rem, 5vw, 3.2rem);
    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-bottom: 12px;
  }
  .hero h1 span { color: var(--accent-light); }
  .hero p {
    color: rgba(255,255,255,0.75);
    font-size: 1.25rem;
    max-width: 560px;
    margin: 0 auto 32px;
  }
  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat-num { font-size: 2.2rem; font-weight: 900; color: var(--accent-light); line-height: 1; }
  .stat-label { font-size: 1.02rem; color: rgba(255,255,255,0.65); margin-top: 4px; }

  /* ─── CONTROLS ─── */
  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(26,86,160,0.07);
  }
  .controls-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 10px 12px 10px 40px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 1.15rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: var(--transition);
  }
  #search:focus { border-color: var(--primary-light); background: #fff; }

  .filter-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    padding: 8px 16px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 1.02rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--primary-light); color: var(--primary); }
  .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  .results-info {
    margin-left: auto;
    font-size: 1.02rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* ─── MAIN LAYOUT ─── */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 60px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 28px;
    align-items: start;
  }

  /* ─── SIDEBAR NAV ─── */
  .sidebar {
    position: sticky;
    top: 76px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 16px;
    box-shadow: var(--shadow);
    max-height: calc(100vh - 110px);
    overflow-y: auto;
  }
  .sidebar h3 {
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0 4px 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .nav-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 1.03rem;
    color: var(--text-muted);
    transition: var(--transition);
    line-height: 1.45;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--primary); }
  .nav-item.active { background: var(--surface-2); color: var(--primary); font-weight: 600; }
  .nav-num {
    flex-shrink: 0;
    background: var(--tag-bg);
    color: var(--primary-dark);
    font-size: 0.9rem;
    font-weight: 700;
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .nav-item.active .nav-num { background: var(--primary); color: #fff; }

  /* ─── CONTENT ─── */
  .content { display: flex; flex-direction: column; gap: 28px; }

  .category-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: var(--transition);
    scroll-margin-top: 90px;
  }
  .category-card.hidden { display: none; }

  .cat-header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    padding: 20px 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    user-select: none;
  }
  .cat-num {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: 800;
    color: #fff;
  }
  .cat-title {
    flex: 1;
    font-size: 1.28rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.4;
  }
  .cat-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .cat-count {
    font-size: 0.98rem;
    background: rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.85);
    padding: 3px 10px;
    border-radius: 100px;
  }
  .cat-toggle {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    transition: var(--transition);
    flex-shrink: 0;
  }
  .cat-header.collapsed .cat-toggle { transform: rotate(-90deg); }

  .topics-wrap { padding: 20px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
  .topics-wrap.collapsed { display: none; }

  .topic-card {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    transition: var(--transition);
  }
  .topic-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .topic-card.topic-hidden { display: none; }

  .topic-header {
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    background: var(--surface);
  }
  .topic-num {
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    font-size: 0.92rem;
    font-weight: 800;
    width: 26px; height: 26px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .topic-title-text {
    flex: 1;
    font-size: 1.17rem;
    font-weight: 700;
    color: var(--primary-dark);
    line-height: 1.45;
  }
  .topic-arrow {
    flex-shrink: 0;
    color: var(--text-muted);
    transition: var(--transition);
    margin-top: 2px;
  }
  .topic-header.open .topic-arrow { transform: rotate(90deg); color: var(--primary); }

  .topic-body { font-size: 19px; 
    display: none;
    padding: 0 16px 16px 54px;
    background: var(--surface-2);
    border-top: 1px solid var(--border);
  }
  .topic-body.open { display: block; }
  .topic-desc {
    font-size: 1.11rem;
    color: var(--text-muted);
    line-height: 1.75;
    padding-top: 14px;
  }
  .topic-desc mark {
    background: rgba(232,160,32,0.25);
    color: var(--text);
    border-radius: 3px;
    padding: 0 2px;
  }

  /* ─── NO RESULTS ─── */
  .no-results {
    display: none;
    text-align: center;
    padding: 80px 24px;
    color: var(--text-muted);
  }
  .no-results svg { margin-bottom: 16px; opacity: 0.4; }
  .no-results h3 { font-size: 1.3rem; margin-bottom: 8px; }
  .no-results p { font-size: 1.1rem; }

  /* ─── EXPAND ALL BTN ─── */
  .expand-all-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 1.02rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }
  .expand-all-btn:hover { border-color: var(--primary-light); color: var(--primary); }

  /* ─── BACK TO TOP ─── */
  #back-top {
    position: fixed;
    bottom: 28px; right: 28px;
    width: 44px; height: 44px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(26,86,160,0.3);
    transition: var(--transition);
    z-index: 200;
  }
  #back-top.visible { display: flex; }
  #back-top:hover { background: var(--primary-dark); transform: translateY(-2px); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 860px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .hero h1 { font-size: 1.7rem; }
    .hero-stats { gap: 20px; }
    .stat-num { font-size: 1.7rem; }
  }

  /* scrollbar */
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<!-- HERO -->
<header class="hero">
  <div class="hero-badge">2025 教學主題資源庫</div>
  <h1>AI與<span>數位學習</span><br>教學主題總覽</h1>
  <p>涵蓋 15 大類別、75 項教學研究主題，整合最新 AI 教育趨勢與實踐策略，供教師研習與課程設計參考。</p>
  <div class="hero-stats">
    <div class="stat"><div class="stat-num">15</div><div class="stat-label">核心類別</div></div>
    <div class="stat"><div class="stat-num">75</div><div class="stat-label">教學主題</div></div>
    <div class="stat"><div class="stat-num">K-12</div><div class="stat-label">適用階段</div></div>
    <div class="stat"><div class="stat-num">108</div><div class="stat-label">課綱對應</div></div>
  </div>
</header>

<!-- CONTROLS -->
<div class="controls">
  <div class="controls-inner">
    <div class="search-wrap">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#8AA0BC" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search" type="text" placeholder="搜尋主題或關鍵字…" autocomplete="off">
    </div>
    <div class="filter-btns" id="filterBtns">
      <button class="filter-btn active" data-filter="all">全部類別</button>
      <button class="filter-btn" data-filter="ai">AI應用</button>
      <button class="filter-btn" data-filter="data">數據分析</button>
      <button class="filter-btn" data-filter="design">課程設計</button>
      <button class="filter-btn" data-filter="teacher">教師發展</button>
      <button class="filter-btn" data-filter="student">學生學習</button>
    </div>
    <button class="expand-all-btn" id="expandAllBtn">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M4 8h16M4 16h16"/>
      </svg>
      全部展開
    </button>
    <span class="results-info" id="resultsInfo">顯示 15 / 15 類別</span>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <h3>類別導覽</h3>
    <div id="navItems"></div>
  </aside>

  <!-- CONTENT -->
  <div class="content" id="content"></div>
  <div class="no-results" id="noResults">
    <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <h3>找不到相關主題</h3>
    <p>請嘗試不同的關鍵字或清除篩選條件</p>
  </div>
</div>

<!-- BACK TO TOP -->
<button id="back-top" title="回到頂部" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>

<script>
const DATA = [
  {
    cat: "AI與數位學習教學理論與趨勢",
    tags: ["ai", "design"],
    topics: [
      { title: "建構主義與AI個人化學習的融合", desc: "探討Vygotsky最近發展區理論如何與AI適性學習系統結合，讓AI成為學生的「智能鷹架」，依據學習者的先備知識與學習速率動態調整教學內容，實現真正意義上的個別化教育。" },
      { title: "混成學習（Hybrid Learning）的理論框架更新", desc: "在後疫情時代，混成學習已從權宜之計演變為主流模式。探討SAMR模型與TPACK框架如何在AI工具加持下進行理論層面的重構，並分析其對教學設計的啟示。" },
      { title: "連結主義（Connectivism）在數位時代的延伸", desc: "Siemens的連結主義強調學習發生於網絡節點之間。探討在生成式AI崛起後，知識節點的定義是否需要重新界定，以及AI如何成為學習者知識網絡中的重要節點。" },
      { title: "多模態學習理論（Multimodal Learning Theory）與AI", desc: "Mayer的多媒體學習認知理論指出，整合文字、圖像、聲音可降低認知負荷。分析AI生成式工具如何協助教師產製多模態教材，以及相關神經教育學研究的最新進展。" },
      { title: "翻轉學習（Flipped Learning）2.0的AI驅動演化", desc: "傳統翻轉學習以影片預習為核心，探討AI如何將翻轉邏輯延伸為「AI預診斷—課中深化—AI後補強」的三段式新模式，並分析其與自主學習能力培養之關聯。" }
    ]
  },
  {
    cat: "學習行為的診斷與分析",
    tags: ["data", "student"],
    topics: [
      { title: "學習歷程資料的多維分析架構", desc: "建立涵蓋認知、行為、情感三維度的學習行為分析模型，運用序列分析（Sequential Analysis）技術追蹤學生在數位學習平台上的操作軌跡，找出影響學習成效的關鍵行為指標。" },
      { title: "眼動追蹤技術在閱讀診斷中的應用", desc: "利用眼動儀分析學生在數位文本閱讀時的凝視點分佈、回視頻率與掃視路徑，診斷閱讀困難類型並設計差異化的閱讀教學介入策略，提升國中小學生的數位閱讀素養。" },
      { title: "情緒感知AI在課堂投入度監測上的倫理與應用", desc: "探討運用電腦視覺與情感運算技術即時分析學生的面部表情與肢體語言，以評估課堂投入程度的技術可行性、準確性，以及隱私保護、數據使用同意等核心倫理議題。" },
      { title: "拖延行為的數位足跡分析與早期預警", desc: "透過分析學生在學習管理系統（LMS）中的登入時間、作業提交模式、影片暫停點等行為數據，建立學業風險預警模型，在學生產生顯著落後前提前介入輔導。" },
      { title: "協作學習中的社會網絡分析（SNA）應用", desc: "運用社會網絡分析方法，視覺化呈現小組協作學習中的互動網絡結構，識別「知識傳遞者」與「孤立節點」，協助教師優化分組策略並促進更均衡的知識流通。" }
    ]
  },
  {
    cat: "AI與數位學習歷程分析",
    tags: ["ai", "data", "student"],
    topics: [
      { title: "學習歷程檔案（ePortfolio）的AI智慧評析", desc: "探討生成式AI如何自動分析學生的數位學習歷程檔案，從時序性成長、反思深度、跨科連結等向度提供結構化的質性回饋，並協助教師進行大規模的學習歷程評閱工作。" },
      { title: "STEM學習路徑的知識圖譜建構", desc: "運用知識圖譜（Knowledge Graph）技術，自動萃取學生在STEM學習歷程中的概念理解軌跡，識別個別學生的知識斷層位置，並自動推薦最適化的補強學習資源。" },

// BUILD NAV
const navContainer = document.getElementById('navItems');
DATA.forEach((section, i) => {
  const item = document.createElement('div');
  item.className = 'nav-item';
  item.dataset.idx = i;
  item.innerHTML = `<span class="nav-num">${i+1}</span><span>${section.cat}</span>`;
  item.onclick = () => {
    document.querySelector(`#cat-${i}`).scrollIntoView({behavior:'smooth', block:'start'});
  };
  navContainer.appendChild(item);
});

// BUILD CONTENT
const content = document.getElementById('content');

DATA.forEach((section, si) => {
  const card = document.createElement('div');
  card.className = 'category-card';
  card.id = `cat-${si}`;
  card.dataset.tags = section.tags.join(',');

  const header = document.createElement('div');
  header.className = 'cat-header';
  header.innerHTML = `
    <div class="cat-num">${si+1}</div>
    <div class="cat-title">${section.cat}</div>
    <div class="cat-meta">
      <span class="cat-count">5 主題</span>
      <div class="cat-toggle">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </div>
    </div>`;

  const topicsWrap = document.createElement('div');
  topicsWrap.className = 'topics-wrap';

  section.topics.forEach((topic, ti) => {
    const tc = document.createElement('div');
    tc.className = 'topic-card';
    tc.dataset.title = topic.title;
    tc.dataset.desc = topic.desc;

    tc.innerHTML = `
      <div class="topic-header">
        <div class="topic-num">${ti+1}</div>
        <div class="topic-title-text">${topic.title}</div>
        <svg class="topic-arrow" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </div>
      <div class="topic-body">
        <div class="topic-desc">${topic.desc}</div>
      </div>`;

    const th = tc.querySelector('.topic-header');
    const tb = tc.querySelector('.topic-body');
    th.onclick = () => {
      const isOpen = th.classList.contains('open');
      th.classList.toggle('open', !isOpen);
      tb.classList.toggle('open', !isOpen);
    };

    topicsWrap.appendChild(tc);
  });

  header.onclick = () => {
    const isCollapsed = header.classList.contains('collapsed');
    header.classList.toggle('collapsed', !isCollapsed);
    topicsWrap.classList.toggle('collapsed', !isCollapsed);
  };

  card.appendChild(header);
  card.appendChild(topicsWrap);
  content.appendChild(card);
});

// SEARCH & FILTER
const searchEl = document.getElementById('search');
const filterBtns = document.querySelectorAll('.filter-btn');
const cards = document.querySelectorAll('.category-card');
const noResults = document.getElementById('noResults');
const resultsInfo = document.getElementById('resultsInfo');
const navItems = document.querySelectorAll('.nav-item');

let currentFilter = 'all';
let currentSearch = '';

function highlight(text, term) {
  if (!term) return text;
  const re = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function applyFilters() {
  let visible = 0;
  cards.forEach((card, i) => {
    const tags = card.dataset.tags.split(',');
    const matchFilter = currentFilter === 'all' || tags.includes(currentFilter);
    
    let matchSearch = true;
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      const catText = DATA[i].cat.toLowerCase();
      const topicMatches = DATA[i].topics.some(t =>
        t.title.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q)
      );
      matchSearch = catText.includes(q) || topicMatches;
    }

    const show = matchFilter && matchSearch;
    card.classList.toggle('hidden', !show);
    navItems[i].style.opacity = show ? '1' : '0.35';

    if (show) {
      visible++;
      // apply highlight
      const topicCards = card.querySelectorAll('.topic-card');
      DATA[i].topics.forEach((topic, ti) => {
        const tc = topicCards[ti];
        if (currentSearch) {
          const q = currentSearch.toLowerCase();
          const matchT = topic.title.toLowerCase().includes(q);
          const matchD = topic.desc.toLowerCase().includes(q);
          const showTopic = matchT || matchD;
          tc.classList.toggle('topic-hidden', !showTopic);
          if (showTopic) {
            tc.querySelector('.topic-title-text').innerHTML = highlight(topic.title, currentSearch);
            tc.querySelector('.topic-desc').innerHTML = highlight(topic.desc, currentSearch);
            if (matchT || matchD) {
              tc.querySelector('.topic-header').classList.add('open');
              tc.querySelector('.topic-body').classList.add('open');
            }
          }
        } else {
          tc.classList.remove('topic-hidden');
          tc.querySelector('.topic-title-text').textContent = topic.title;
          tc.querySelector('.topic-desc').textContent = topic.desc;
        }
      });
    }
  });

  noResults.style.display = visible === 0 ? 'block' : 'none';
  resultsInfo.textContent = `顯示 ${visible} / 15 類別`;
}

searchEl.addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  applyFilters();
});

filterBtns.forEach(btn => {
  btn.onclick = () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilters();
  };
});

// EXPAND ALL
let allExpanded = false;
document.getElementById('expandAllBtn').onclick = function() {
  allExpanded = !allExpanded;
  document.querySelectorAll('.topic-header').forEach(th => {
    th.classList.toggle('open', allExpanded);
    th.nextElementSibling.classList.toggle('open', allExpanded);
  });
  this.textContent = allExpanded ? '全部收合' : '全部展開';
};

// SCROLL SPY
const backTop = document.getElementById('back-top');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const idx = e.target.id.replace('cat-','');
      navItems.forEach(n => n.classList.remove('active'));
      if (navItems[idx]) navItems[idx].classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });

cards.forEach(c => observer.observe(c));

window.addEventListener('scroll', () => {
  backTop.classList.toggle('visible', window.scrollY > 400);
});
</script>
