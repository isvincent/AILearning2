<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI與數位學習研究主題總覽</title>
<style>
  :root {
    --deep-navy: #1a2b4a;
    --mid-blue: #2c4a7c;
    --sky: #4a90d9;
    --accent: #e8a020;
    --light: #f0f5fc;
    --white: #ffffff;
    --text: #1a1a2e;
    --muted: #5a6a7e;
    --radius: 12px;
    --shadow: 0 4px 20px rgba(26,43,74,0.12);
    --shadow-hover: 0 8px 32px rgba(26,43,74,0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { font-size: 19px; 
    font-family: 'Segoe UI', 'PingFang TC', 'Noto Sans TC', sans-serif;
    background: var(--light);
    color: var(--text);
    line-height: 1.7;
  }

  /* === HERO === */
  .hero {
    background: linear-gradient(135deg, var(--deep-navy) 0%, var(--mid-blue) 60%, #1e5080 100%);
    color: white;
    padding: 56px 24px 48px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: rgba(74,144,217,0.15);
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -40px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: rgba(232,160,32,0.1);
    pointer-events: none;
  }
  .hero h1 {
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    font-weight: 800;
    letter-spacing: .04em;
    margin-bottom: 12px;
    position: relative;
  }
  .hero h1 span { color: var(--accent); }
  .hero p {
    font-size: 1.2rem;
    opacity: .8;
    max-width: 600px;
    margin: 0 auto 28px;
    position: relative;
  }
  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
    margin-top: 8px;
    position: relative;
  }
  .stat-box {
    text-align: center;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 16px 28px;
    backdrop-filter: blur(8px);
  }
  .stat-box .num {
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent);
    display: block;
  }
  .stat-box .lbl { font-size: .8rem; opacity: .75; }

  /* === CONTROLS === */
  .controls {
    background: var(--white);
    border-bottom: 2px solid #e0e8f4;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 9px 14px 9px 38px;
    border: 2px solid #d0dcea;
    border-radius: 8px;
    font-size: .9rem;
    outline: none;
    transition: border-color .2s;
    font-family: inherit;
  }
  .search-wrap input:focus { border-color: var(--sky); }
  .search-icon {
    position: absolute;
    left: 11px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 1.2rem;
    pointer-events: none;
  }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .ctrl-btn {
    padding: 8px 14px;
    border: 2px solid #d0dcea;
    background: var(--white);
    border-radius: 8px;
    cursor: pointer;
    font-size: .82rem;
    font-weight: 600;
    color: var(--muted);
    transition: all .2s;
    font-family: inherit;
    white-space: nowrap;
  }
  .ctrl-btn:hover, .ctrl-btn.active {
    background: var(--deep-navy);
    border-color: var(--deep-navy);
    color: white;
  }
  .count-badge {
    background: var(--accent);
    color: white;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: .8rem;
    font-weight: 700;
    margin-left: auto;
    white-space: nowrap;
  }

  /* === MAIN LAYOUT === */
  .main { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }

  /* === CATEGORY CARD === */
  .category {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
    border: 1px solid #e4eaf4;
    transition: box-shadow .25s;
  }
  .category:hover { box-shadow: var(--shadow-hover); }
  .category.hidden { display: none; }

  .cat-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    cursor: pointer;
    transition: background .2s;
    user-select: none;
  }
  .cat-header:hover { background: rgba(0,0,0,0.02); }

  .cat-num {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: .9rem;
    font-weight: 800;
    color: white;
    flex-shrink: 0;
  }
  .cat-title-wrap { flex: 1; }
  .cat-title {
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.3;
  }
  .cat-sub {
    font-size: .78rem;
    color: var(--muted);
    margin-top: 3px;
  }
  .topic-pills {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .topic-pill-mini {
    font-size: .68rem;
    padding: 2px 8px;
    border-radius: 20px;
    background: #f0f5fc;
    color: var(--muted);
    border: 1px solid #d8e4f0;
  }
  .cat-chevron {
    font-size: 1.3rem;
    color: var(--muted);
    transition: transform .3s;
    flex-shrink: 0;
  }
  .cat-header.open .cat-chevron { transform: rotate(180deg); }

  /* === TOPICS === */
  .topics-wrap {
    border-top: 1px solid #e8eef8;
    display: none;
  }
  .topics-wrap.open { display: block; }

  .topic-item {
    padding: 16px 22px 16px 74px;
    border-bottom: 1px solid #f0f5fa;
    position: relative;
    transition: background .15s;
  }
  .topic-item:last-child { border-bottom: none; }
  .topic-item:hover { background: #fafcff; }
  .topic-item.hidden { display: none; }

  .topic-idx {
    position: absolute;
    left: 22px; top: 18px;
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: .78rem;
    font-weight: 800;
    color: white;
  }
  .topic-name {
    font-size: .95rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--deep-navy);
  }
  .topic-name .highlight { background: #fff3b0; border-radius: 3px; padding: 0 2px; }
  .topic-desc {
    font-size: .86rem;
    color: #4a5870;
    line-height: 1.72;
  }
  .topic-desc .highlight { background: #fff3b0; border-radius: 3px; padding: 0 2px; }

  /* === EMPTY STATE === */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    display: none;
  }
  .empty-state.show { display: block; }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
  .empty-state p { font-size: 1.2rem; }

  /* === PROGRESS BAR (decorative) === */
  .progress-strip {
    height: 4px;
    background: #e8eef8;
    margin: 0 22px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--sky), var(--accent));
    width: 100%;
  }

  /* === FOOTER === */
  .footer {
    text-align: center;
    padding: 28px;
    color: var(--muted);
    font-size: .82rem;
    border-top: 1px solid #e0e8f4;
    background: var(--white);
    margin-top: 20px;
  }

  @media (max-width: 600px) {
    .stats { gap: 16px; }
    .topic-item { padding-left: 60px; }
    .cat-header { padding: 14px 16px; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>AI與數位學習<span>研究主題</span>總覽</h1>
  <p>15大研究領域，每領域5項精選研究主題，共75個可深入探索的研究方向</p>
  <div class="stats">
    <div class="stat-box"><span class="num">15</span><span class="lbl">研究領域</span></div>
    <div class="stat-box"><span class="num">75</span><span class="lbl">研究主題</span></div>
    <div class="stat-box"><span class="num">5</span><span class="lbl">主題/領域</span></div>
  </div>
</div>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜尋主題關鍵字…" oninput="doSearch()">
  </div>
  <div class="btn-group">
    <button class="ctrl-btn active" onclick="expandAll()">展開全部</button>
    <button class="ctrl-btn" onclick="collapseAll()">收合全部</button>
    <button class="ctrl-btn" onclick="clearSearch()">清除搜尋</button>
  </div>
  <span class="count-badge" id="countBadge">顯示 75 / 75 個主題</span>
</div>

<div class="main" id="mainContent"></div>
<div class="empty-state" id="emptyState">
  <div class="icon">🔍</div>
  <p>找不到符合「<span id="emptyKeyword"></span>」的主題，請試試其他關鍵字。</p>
</div>

<div class="footer">
  AI與數位學習研究主題彙整 · 共 15 大領域 75 個研究主題 · 點擊各領域標題可展開或收合
</div>

<script>
const CATEGORIES = [
  {
    title: "AI與數位學習教學理論與趨勢",
    color: "#1E3A5F", bg: "#D6E4F0",
    topics: [
      { name: "建構主義與AI輔助學習的融合", desc: "探討皮亞傑建構主義理論如何與AI個人化學習工具結合，分析學習者在AI輔助環境下主動建構知識的歷程，並提出適合數位原住民世代的教學模式。" },
      { name: "聯結主義與深度學習網絡的教學應用", desc: "以席門斯（Siemens）聯結主義為基礎，探討神經網路類比人類學習的理論意涵，分析數位時代「學習即連結」在AI學習平台設計中的具體實踐。" },
      { name: "混成學習（Blended Learning）的新型態發展趨勢", desc: "系統性回顧混成學習從傳統線上線下整合到AI驅動的自適應混成模型之演進，探討後疫情時代混成學習設計的最佳實踐與未來趨勢。" },
      { name: "自我調節學習（SRL）與AI學習支持系統", desc: "分析Zimmerman自我調節學習理論在AI學習環境中的應用，探討AI如何透過即時反饋、學習提示與進度追蹤，強化學習者的自我監控、規劃與調節能力。" },
      { name: "生成式AI對教學典範轉移的影響", desc: "探討ChatGPT、Copilot等生成式AI工具對「以教師為中心」到「以學習者為中心」教學典範的衝擊，分析新興AI工具如何重塑教學者角色與學習互動型態。" }
    ]
  },
  {
    title: "學習行為的診斷與分析",
    color: "#1A4731", bg: "#D5F0E3",
    topics: [
      { name: "學習歷程數據採集與學習行為模式識別", desc: "研究如何利用學習管理系統（LMS）記錄學習者的點擊流、學習時間分佈、重複瀏覽行為等數位足跡，透過機器學習算法識別不同學習行為模式並提供診斷建議。" },
      { name: "早期預警系統（EWS）在學習診斷的設計與應用", desc: "探討以機器學習構建學習預警系統，透過分析出勤率、作業繳交率、測驗成績等多維數據，早期識別學習落後學生並啟動個別化介入支援機制。" },
      { name: "認知負荷診斷與AI輔助學習材料調適", desc: "以Sweller認知負荷理論為基礎，研究如何透過眼動追蹤、滑鼠移動軌跡、回答速度等行為數據診斷學習者的認知負荷狀態，進而動態調整AI推薦的學習材料難度。" },
      { name: "學習情緒狀態偵測與情感計算應用", desc: "探討運用人臉辨識、語音分析、生理信號偵測等技術識別學習者的情緒狀態（投入、無聊、挫折），分析情緒數據對學習成效的影響並設計相應的教學介入策略。" },
      { name: "學習風格診斷工具的AI化與個人化應用", desc: "重新審視VARK、Kolb等傳統學習風格理論在AI時代的適用性，探討以機器學習取代問卷式診斷，透過動態行為分析建立更精準的個人化學習風格模型。" }
    ]
  },
  {
    title: "AI與數位學習歷程分析",
    color: "#5C1F1F", bg: "#F5E0E0",
    topics: [
      { name: "學習分析（Learning Analytics）的理論框架與實務應用", desc: "系統性介紹學習分析的核心概念、倫理考量與實施框架，探討如何在中小學與高等教育場域運用學習數據優化教學決策，並分析國內外成功案例。" },
      { name: "學習歷程檔案（ePortfolio）的AI輔助分析", desc: "研究如何運用自然語言處理（NLP）與圖像識別技術分析學生的數位學習歷程檔案，從非結構化的反思日誌、作品集中萃取有意義的學習成長軌跡與能力指標。" },

      { name: "社會網絡分析（SNA）在協作學習評量的應用", desc: "研究如何運用社會網絡分析技術可視化線上學習社群的互動關係，透過測量中心性、密度等指標評量學習者的協作參與程度，並識別學習社群中的孤立者與意見領袖。" },
      { name: "跨平台學習數據整合與全人學習輪廓建構", desc: "探討如何整合來自不同學習系統（LMS、遊戲化平台、社群媒體、線上考試）的碎片化數據，建構完整的學習者數位輪廓（Learner Profile），支援全人教育評量。" }
    ]
  },
  {

      { name: "自適應課程（Adaptive Curriculum）設計原則與技術架構", desc: "分析自適應學習系統的課程設計原則，探討知識圖譜（Knowledge Graph）、貝葉斯知識追蹤（BKT）與強化學習在動態課程調適中的應用，並提出實施路線圖。" },
      { name: "AI輔助學習目標撰寫與布魯姆分類法的現代詮釋", desc: "研究如何運用AI工具輔助教師撰寫符合布魯姆認知分類架構的具體學習目標，探討AI在分析、綜合、評鑑等高層次思維目標設計上的輔助潛力與限制。" },
      { name: "微學習（Microlearning）模組設計與AI內容拆解策略", desc: "探討微學習的認知科學基礎與設計原則，研究如何運用AI自動將大型課程內容拆解為最適單元（Optimal Learning Unit），設計適合行動學習情境的微學習序列。" },
      { name: "普適課程設計（UDL）與AI差異化教學材料生成", desc: "以普適學習設計（Universal Design for Learning）三大原則為框架，探討AI如何自動生成多元表徵、多元行動與多元參與方式的差異化教學材料，實現真正的融合教育。" }
    ]
  },
  {
    title: "AI與數位學習教學策略與模式",

    topics: [
      { name: "翻轉學習（Flipped Learning）2.0：AI增強的課前課後設計", desc: "探討生成式AI如何強化翻轉學習的課前準備（AI個人化預習影片、互動問答）與課後延伸（AI輔導對話、個人化練習題），提升翻轉教室的學習成效與教師備課效率。" },
      { name: "蘇格拉底式AI對話教學法的設計與應用", desc: "研究如何設計以蘇格拉底探究法為基礎的AI對話教學系統，透過啟發性問題引導學習者批判性思考，分析AI問答設計的層次架構與教學對話品質評估指標。" },

      { name: "問題導向學習（PBL）與AI真實情境案例生成", desc: "研究AI生成式工具在問題導向學習設計中的應用，探討如何運用AI創建貼近真實世界的開放性問題情境、客製化學習鷹架，以及設計符合核心素養的跨域PBL課程。" }
    ]
  },
  {
    title: "AI與數位學習教學與評量",

      { name: "循證教育（Evidence-Based Education）的資料素養實踐路徑", desc: "以循證教育為目標，探討資料素養如何支持教育工作者識別、評估、應用教育研究證據，研究教育場域「知識轉化」（Knowledge Translation）的機制，縮短研究與實踐的落差。" }
    ]
  }
];

function escapeHTML(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlight(text, kw) {
  if (!kw) return escapeHTML(text);
  const escaped = escapeHTML(text);
  const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return escaped.replace(re, m => `<span class="highlight">${m}</span>`);
}

function buildUI() {
  const container = document.getElementById('mainContent');
  CATEGORIES.forEach((cat, ci) => {
    const el = document.createElement('div');
    el.className = 'category';
    el.dataset.catIdx = ci;

    const miniPills = cat.topics.map(t =>
      `<span class="topic-pill-mini">${escapeHTML(t.name.split('（')[0].substring(0,12))}…</span>`
    ).join('');

    el.innerHTML = `
      <div class="cat-header open" onclick="toggleCat(${ci})" data-ci="${ci}">
        <div class="cat-num" style="background:${cat.color}">${ci+1}</div>
        <div class="cat-title-wrap">
          <div class="cat-title" style="color:${cat.color}">${escapeHTML(cat.title)}</div>
          <div class="cat-sub">5 個研究主題</div>
        </div>
        <span class="cat-chevron">▼</span>
      </div>
      <div class="progress-strip"><div class="progress-fill" style="background:linear-gradient(90deg,${cat.color}80,${cat.color})"></div></div>
      <div class="topics-wrap open" id="topics-${ci}">
        ${cat.topics.map((t, ti) => `
          <div class="topic-item" data-ci="${ci}" data-ti="${ti}">
            <div class="topic-idx" style="background:${cat.color}">${ti+1}</div>
            <div class="topic-name" data-raw="${escapeHTML(t.name)}">${escapeHTML(t.name)}</div>
            <div class="topic-desc" data-raw="${escapeHTML(t.desc)}">${escapeHTML(t.desc)}</div>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(el);
  });
}

function toggleCat(ci) {
  const wrap = document.getElementById('topics-' + ci);
  const hdr = document.querySelector(`.cat-header[data-ci="${ci}"]`);
  const isOpen = wrap.classList.contains('open');
  if (isOpen) { wrap.classList.remove('open'); hdr.classList.remove('open'); }
  else { wrap.classList.add('open'); hdr.classList.add('open'); }
}

function expandAll() {
  document.querySelectorAll('.topics-wrap').forEach(w => w.classList.add('open'));
  document.querySelectorAll('.cat-header').forEach(h => h.classList.add('open'));
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function collapseAll() {
  document.querySelectorAll('.topics-wrap').forEach(w => w.classList.remove('open'));
  document.querySelectorAll('.cat-header').forEach(h => h.classList.remove('open'));
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  doSearch();
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.ctrl-btn')[0].classList.add('active');
}

function doSearch() {
  const kw = document.getElementById('searchInput').value.trim();
  let visibleCount = 0;

  document.querySelectorAll('.category').forEach((catEl, ci) => {
    const cat = CATEGORIES[ci];
    let catHasMatch = false;
    const topicEls = catEl.querySelectorAll('.topic-item');

    topicEls.forEach((tEl, ti) => {
      const t = cat.topics[ti];
      const match = !kw || t.name.includes(kw) || t.desc.includes(kw) || cat.title.includes(kw);
      if (match) {
        tEl.classList.remove('hidden');
        catHasMatch = true;
        visibleCount++;
        // re-highlight
        tEl.querySelector('.topic-name').innerHTML = highlight(t.name, kw);
        tEl.querySelector('.topic-desc').innerHTML = highlight(t.desc, kw);
      } else {
        tEl.classList.add('hidden');
      }
    });

    if (catHasMatch) {
      catEl.classList.remove('hidden');
      if (kw) {
        catEl.querySelector('.topics-wrap').classList.add('open');
        catEl.querySelector('.cat-header').classList.add('open');
      }
    } else {
      catEl.classList.add('hidden');
    }
  });

  document.getElementById('countBadge').textContent = `顯示 ${visibleCount} / 75 個主題`;

  const empty = document.getElementById('emptyState');
  if (visibleCount === 0 && kw) {
    empty.classList.add('show');
    document.getElementById('emptyKeyword').textContent = kw;
  } else {
    empty.classList.remove('show');
  }
}

buildUI();
</script>
</body>
