": "C14-2", "cluster": "分析與資料決策", "category": "教育大數據的趨勢與應用"}, {"title": "AI模型在校務預測的應用", "desc": "以出缺席、學習表現、輔導紀錄與平台資料建立風險預測，但需搭配教師專業與倫理審查。", "id": "C14-3", "cluster": "分析與資料決策", "category": "教育大數據的趨勢與應用"}, {"title": "教育政策成效追蹤", "desc": "設計政策指標與資料儀表板，追蹤數位學習、AI導入、教師培訓與學生學習的變化。", "id": "C14-4", "cluster": "分析與資料決策", "category": "教育大數據的趨勢與應用"}, {"title": "開放資料與跨域研究合作", "desc": "在保護個資前提下，促進學校、大學、政府與產業合作，發展可驗證、可複製的教育創新證據。", "id": "C14-5", "cluster": "分析與資料決策", "category": "教育大數據的趨勢與應用"}]}, {"id": "C15", "item": "資料素養驅動教育現場的決策", "cluster": "分析與資料決策", "summary": "培養教師與行政人員提出問題、判讀資料、形成假設、採取行動與檢核成效的資料素養。", "topics": [{"title": "教師資料素養入門課程", "desc": "從資料類型、基本統計、視覺化、常見誤讀與隱私原則入手，讓教師能安全使用教學資料。", "id": "C15-1", "cluster": "分析與資料決策", "category": "資料素養驅動教育現場的決策"}, {"title": "問題導向資料探究循環", "desc": "以「提出問題、蒐集資料、分析解釋、採取行動、檢核效果」流程推動班級或學年層級改進。", "id": "C15-2", "cluster": "分析與資料決策", "category": "資料素養驅動教育現場的決策"}, {"title": "儀表板判讀與行動假設", "desc": "訓練教師讀懂趨勢、分布、異常值與關聯，並把觀察轉成可驗證的教學或輔導行動假設。", "id": "C15-3", "cluster": "分析與資料決策", "category": "資料素養驅動教育現場的決策"}, {"title": "資料故事與溝通說明", "desc": "把分析結果轉成校務會議、親師溝通或社群分享可理解的資料故事，避免只有數字沒有脈絡。", "id": "C15-4", "cluster": "分析與資料決策", "category": "資料素養驅動教育現場的決策"}, {"title": "資料倫理與偏誤檢核", "desc": "檢視資料來源、代表性、標籤定義、解釋限制與可能偏誤，避免用資料強化刻板印象或不公平決策。", "id": "C15-5", "cluster": "分析與資料決策", "category": "資料素養驅動教育現場的決策"}]}], "refs": [["教育部推動中小學數位學習精進方案入口網：資料下載（AI素養框架、AI使用和學習指引、中小學生成式AI學習應用手冊等）", "https://pads.moe.edu.tw/download.php"], ["教育部新聞稿：接軌國際趨勢擘劃中小學數位學習未來", "https://www.edu.tw/News_Content.aspx?n=9E7AC85F1954DDA8&s=4FF8A55F908F23B9&sms=169B8E91BB75571F"], ["教育部新聞稿：教育革新AI助力數位學習新時代", "https://www.edu.tw/News_Content.aspx?n=9E7AC85F1954DDA8&s=28869789E28E14F9&sms=169B8E91BB75571F"], ["UNESCO：AI Competency Framework for Teachers", "https://www.unesco.org/en/articles/ai-competency-framework-teachers"], ["UNESCO：AI Competency Framework for Students", "https://www.unesco.org/en/articles/ai-competency-framework-students"], ["OECD：Digital Education Outlook 2026", "https://www.oecd.org/en/publications/oecd-digital-education-outlook-2026_062a7394-en.html"], ["SoLAR：What is Learning Analytics?", "https://www.solaresearch.org/about/what-is-learning-analytics/"], ["UNESCO：Virtual reality in education", "https://unesdoc.unesco.org/ark:/48223/pf0000372385"], ["OECD：An overview of national strategies and policies for immersive technologies", "https://www.oecd.org/en/publications/an-overview-of-national-strategies-and-policies-for-immersive-technologies_2da1d7da-en.html"]]};
const state = { cluster: 'all', category: 'all', query: '', expanded: false };
const $ = (id) => document.getElementById(id);
const escapeHTML = (str) => String(str).replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
function highlight(text, q) {
  const safe = escapeHTML(text);
  if (!q) return safe;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return safe.replace(re, m => `<mark>${m}</mark>`);
}
function initControls() {
  DATA.categories.forEach(c => {
    const opt = document.createElement('option'); opt.value = c.id; opt.textContent = c.item; $('categorySelect').appendChild(opt);
  });
  const chips = $('chips');
  const all = document.createElement('button'); all.type = 'button'; all.className = 'chip active'; all.textContent = '全部面向'; all.dataset.cluster = 'all'; chips.appendChild(all);
  DATA.clusters.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = c.name; b.dataset.cluster = c.name; chips.appendChild(b); });
  chips.addEventListener('click', e => { if (!e.target.matches('.chip')) return; state.cluster = e.target.dataset.cluster; syncControls(); render(); });
  $('search').addEventListener('input', e => { state.query = e.target.value.trim(); render(); });
  $('categorySelect').addEventListener('change', e => { state.category = e.target.value; render(); });
  $('reset').addEventListener('click', () => { state.cluster='all'; state.category='all'; state.query=''; state.expanded=false; $('search').value=''; $('categorySelect').value='all'; syncControls(); render(); });
  $('expandAll').addEventListener('click', () => { state.expanded = !state.expanded; $('expandAll').textContent = state.expanded ? '全部收合' : '全部展開'; render(); });
}
function syncControls() {
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.cluster === state.cluster));
}
function buildBars() {
  const max = Math.max(...DATA.clusters.map(c => c.count));
  $('bars').innerHTML = DATA.clusters.map(c => `
    <div class="bar-row" data-cluster="${escapeHTML(c.name)}" title="篩選：${escapeHTML(c.name)}">
      <div class="bar-label">${escapeHTML(c.name)}</div>
      <div class="bar-track"><div class="bar" style="width:${Math.round(c.count / max * 100)}%"></div></div>
      <div class="bar-count">${c.count}</div>
    </div>`).join('');
  $('bars').addEventListener('click', e => {
    const row = e.target.closest('.bar-row'); if (!row) return;
    state.cluster = row.dataset.cluster; syncControls(); render(); window.scrollTo({top: 250, behavior: 'smooth'});
  });
}
function buildMiniGrid() {
  $('miniGrid').innerHTML = DATA.categories.map(c => `<div class="mini" data-cat="${c.id}"><b>${escapeHTML(c.item)}</b><span>${escapeHTML(c.cluster)} · 5個主題</span></div>`).join('');
  $('miniGrid').addEventListener('click', e => { const el = e.target.closest('.mini'); if (!el) return; state.category = el.dataset.cat; $('categorySelect').value = state.category; render(); document.querySelector('[data-card="'+state.category+'"]').scrollIntoView({behavior:'smooth', block:'start'}); });
}
function topicMatches(topic, category) {
  const q = state.query.toLowerCase();
  const queryOk = !q || [topic.title, topic.desc, category.item, category.summary, category.cluster].join(' ').toLowerCase().includes(q);
  const clusterOk = state.cluster === 'all' || category.cluster === state.cluster;
  const categoryOk = state.category === 'all' || category.id === state.category;
  return queryOk && clusterOk && categoryOk;
}
function render() {
  const q = state.query;
  let visibleTopics = 0;
  const cards = [];
  DATA.categories.forEach(cat => {
    const topics = cat.topics.filter(t => topicMatches(t, cat));
    if (!topics.length) return;
    visibleTopics += topics.length;
    cards.push(`<section class="card category-card" data-card="${cat.id}">
      <div class="cat-head" onclick="this.parentElement.classList.toggle('collapsed'); const box=this.parentElement.querySelector('.topic-list'); box.style.display = box.style.display==='none' ? 'grid' : 'none';">
        <div>
          <h3 class="cat-title">${highlight(cat.item, q)}</h3>
          <div class="badges"><span class="badge">${escapeHTML(cat.cluster)}</span><span class="badge">${topics.length} / 5 個主題</span></div>
          <p class="cat-summary">${highlight(cat.summary, q)}</p>
        </div><div class="toggle">展開/收合</div>
      </div>
      <div class="topic-list" style="display:${state.expanded ? 'grid' : 'grid'}">
        ${topics.map(t => `<details class="topic" ${state.expanded || q ? 'open' : ''}><summary>${highlight(t.id + '　' + t.title, q)}</summary><p>${highlight(t.desc, q)}</p></details>`).join('')}
      </div>
    </section>`);
  });
  $('sections').innerHTML = cards.join('');
  $('resultLine').textContent = `目前顯示 ${visibleTopics} / 75 個主題` + (state.cluster !== 'all' ? ` · 面向：${state.cluster}` : '') + (state.category !== 'all' ? ` · 項目：${DATA.categories.find(c=>c.id===state.category)?.item || ''}` : '');
  $('empty').style.display = visibleTopics ? 'none' : 'block';
}
function buildRefs() {
  $('refs').innerHTML = DATA.refs.map(r => `<li>${escapeHTML(r[0])}：<a href="${escapeHTML(r[1])}" target="_blank" rel="noreferrer">${escapeHTML(r[1])}</a></li>`).join('');
}
initControls(); buildBars(); buildMiniGrid(); buildRefs(); render();
</script>
